# Hosting for Crash Out: Houston Edition (prototypes/siren-tag) on Render.
# One web service: it serves the game page and runs the private rooms.
# In Render: New > Blueprint, connect this repository, pick this branch, Deploy Blueprint.
services:
  - type: web
    name: crash-out-houston
    runtime: node
    plan: free
    rootDir: prototypes/siren-tag
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MAX_ROOMS
        value: "4"
