// =========================================================================================

// grass lots, then a bayou along the north side, and downtown's skyline on the far bank.

// =========================================================================================
const ROAD = 16, PITCH = 60, BLOCK = PITCH - ROAD;        // metres

const CH = { z0: 130, z1: 170, slope: 9, depth: 4.5, w0: 146, w1: 154, fordX: 60, fordW: 10, bridgeW: 8 }; // the bayou's channel

const PAL = {

let waterTex = null;
function bankY(z) { // how far the ground drops into the bayou at this z

const scene3 = new THREE.Scene();

{ // the sunset sky

      text((p.host ? 'HOST   ' : '') + (p.on ? (net.phase !== 'lobby' && p.seat < 0 ? 'joins at the rematch' : 'here') : 'away'), W / 2 + 400, y, 20, p.on ? '#7dff5a' : '#ff9ab0', 'right');
    }
    RIGS.forEach((k, i) => {
      const x = CARDS[i], on = you && you.kind === i, K = KINDS[k], y = LOBBY.cardY, other = net.players.some(p => p !== you && p.kind === i);
      panel(x - CARD_W / 2, y, CARD_W, LOBBY.cardH, on ? 'rgba(255,225,74,0.96)' : undefined);
      icon(k, x, y + 28, 14, false); text(K.label, x, y + 64, 22, on ? PAL.ink : '#fff'); text(K.good, x, y + 90, 15, on ? PAL.ink : '#7dff5a'); text(K.bad, x, y + 110, 15, on ? PAL.ink : '#ff9ab0');
      text(on ? (other ? 'YOU AND THE OTHER PLAYER' : 'YOU') : other ? 'THE OTHER PLAYER' : '', x, y + 132, 13, on ? PAL.ink : '#7df0ff');
    });
    panel(W / 2 - 230, LOBBY.botsY - 20, 460, 40); text(`BOTS IN THE MATCH: ${net.bots}` + (you && you.host ? `   (${touchy ? 'tap' : 'B'} to change)` : ''), W / 2, LOBBY.botsY, 19, '#ffe14a');
    const sb = LOBBY.start;
    if (net.phase !== 'lobby') text('A shift is being played: you join at the rematch', W / 2, sb.y, 26, '#fff');
    else if (you && you.host) { panel(sb.x - sb.w / 2, sb.y - sb.h / 2, sb.w, sb.h, 'rgba(255,225,74,0.96)'); text(net.players.length < 2 ? 'START WITHOUT A SECOND PLAYER' : 'START THE SHIFT', sb.x, sb.y - (touchy ? 0 : 8), net.players.length < 2 ? 22 : 28, PAL.ink); if (!touchy) text('Enter', sb.x, sb.y + 19, 14, PAL.ink); }
    else text('Waiting for the host to start', W / 2, sb.y, 28, '#fff');
    text(net.status !== 'on' ? 'Connection lost: reconnecting...' : (touchy ? 'Tap a rig to choose it.' : 'Left / Right: your rig.   C: copy link.   Esc: leave the room.'), W / 2, 680, 16, net.status !== 'on' ? '#ff9ab0' : '#d8ccff');
  },
};
scenes.brResults = { // the buzzer has gone: nothing scores any more. Rematch, or change mode.
  update() {
    if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; }
    else if (pressed('Escape') || pressed('KeyC')) { scene = 'title'; reset(); }
  },
  draw() {
    drawPlay(); shade(0.94); const R = state.result, touchy = touch.on || touch.coarse;
    text(R.draw ? 'DRAW' : R.leaders[0] === ME ? 'YOU WIN' : `${SEAT_NAMES[R.leaders[0]].toUpperCase()} WINS`, W / 2, 62, 62, PAL.it); text(state.gained, W / 2, 112, 22, '#fff');
    const rh = R.rows.length > 6 ? 50 : 58, y0 = 172, cx = [W / 2 - 330, W / 2 - 250, W / 2 - 215, W / 2 + 180, W / 2 + 330];
    text('PLACE', cx[0], y0 - 30, 16, '#ffe14a'); text('RIG', cx[2], y0 - 30, 16, '#ffe14a', 'left'); text('WRECKS', cx[3], y0 - 30, 16, '#ffe14a'); text('LOSSES', cx[4], y0 - 30, 16, '#ffe14a');
    R.rows.forEach((r, n) => { const y = y0 + n * rh, mine = r.i === ME; panel(W / 2 - 390, y - rh / 2 + 3, 780, rh - 6, mine ? 'rgba(255,225,74,0.94)' : undefined);
      const col = mine ? PAL.ink : '#fff'; text(String(r.place), cx[0], y, 28, col); icon(RIGS[r.i % 4], cx[1], y, 11, false); text(who(r.i), cx[2], y, 24, col, 'left'); text(String(r.kills), cx[3], y, 30, col); text(String(r.deaths), cx[4], y, 30, col); });
    for (const k in RES_BTN) { const b = RES_BTN[k]; panel(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, k === 'rematch' ? 'rgba(255,225,74,0.96)' : 'rgba(20,12,48,0.92)'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h); text(b.label, b.x, b.y - (touchy ? 0 : 8), 26, k === 'rematch' ? PAL.ink : '#fff'); if (!touchy) text(k === 'rematch' ? 'Enter' : 'Esc', b.x, b.y + 17, 14, k === 'rematch' ? PAL.ink : '#d8ccff'); }
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (NET && NET.client) netClientStep(); else scenes[scene].update(STEP);
  netHousekeep(); hit.clear(); soundStep();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
let lastFault = '';
function frame() { // one bad step must never stop the game: note it, drop the pending presses, carry on
  try { tick(); } catch (e) { hit.clear(); if (String(e) !== lastFault) { lastFault = String(e); console.error(e); } }
  requestAnimationFrame(frame);
}
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) { try { tick(); } catch (e) { hit.clear(); } } }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get me() { return ME; }, set me(i) { ME = i; },
  get mode() { return MODE; }, set mode(m) { MODE = m; },
  get netInfo() { return { status: net.status, code: net.code, phase: net.phase, players: net.players, you: net.you, err: net.err, link: net.code ? netLink() : '', held: net.held, pending: net.pending.length, client: !!(NET && NET.client) }; },
  net: { // the server's side of a room: it starts shifts, feeds inputs in and takes snapshots out, all as JSON
    hostStart(json) { const o = JSON.parse(json); MODE = 'tag'; CONFIG.bots.value = o.bots; ME = o.roles[0]; NET = { host: true, humans: o.humans, roles: o.roles, inputs: {}, away: {}, acks: {}, next: {}, wait: 0, tagN: 0, tagLog: [] }; reset(); scene = 'play'; },
    hostInput(seat, json) {
      const m = JSON.parse(json); if (!NET || !NET.humans.includes(seat)) return;
      NET.inputs[seat] = { throttle: clamp(+m.th || 0, -1, 1), steer: clamp(+m.st || 0, -1, 1), hand: !!m.h, fire: false }; NET.next[seat] = m.s | 0;
      if (m.r && scene === 'play' && state.phase === 'run' && state.vehicles[seat].active) resetOnRoad(state.vehicles[seat]);
    },
    hostTest(json) { // stage a situation, for the checks: who is IT, the clock, where rigs stand. Only reachable when the server allows tests.
      const o = JSON.parse(json), humans = NET.humans;
      if (o.park) { let k = 0; const far = [[-120, -120], [120, -120], [-120, 60], [120, 60], [-120, 0], [120, 0]]; for (const v of state.vehicles) { if (v.i >= NR) { v.x = 900 + v.i * 9; v.z = 900; } else if (v.active && !humans.includes(v.i)) { [v.x, v.z] = far[k++ % far.length]; v.vx = v.vz = 0; v.stall = 30; } } }
      for (const [i, x, z, h] of o.place || []) Object.assign(state.vehicles[i], { x, z, h, vx: 0, vz: 0, spin: 0, stall: 0, immune: 0, layer: null });
      if (o.clear) for (const i of humans) { state.vehicles[i].immune = 0; state.vehicles[i].stall = 0; }
      if (o.it !== undefined) state.it = o.it === 'bot' ? state.roles.find(i => !humans.includes(i)) : o.it;
      if (o.round) state.round = o.round;
      if (o.clock !== undefined) state.clock = o.clock;
      if (o.place || o.park) NET.inputs = {};
    },
    hostAway(seat, how) { if (!NET) return; if (how) { NET.away[seat] = how; delete NET.inputs[seat]; } else delete NET.away[seat]; },
    hostTick() { // between rounds the server counts down, then starts the next one or the replay
      if (events.length > 600) events.splice(0, events.length - 200);
      if (scene === 'between' || scene === 'over') { NET.wait += STEP; if (NET.wait >= tune.net_between) { NET.wait = 0; startRound(scene === 'over' ? state.round : state.round + 1); scene = 'play'; } } else NET.wait = 0;
    },
    snapshot() {
      const q = x => Math.round(x * 100) / 100;
      return JSON.stringify({ sc: scene, r: state.round, ph: state.phase, ct: q(state.count), ck: q(state.clock), it: state.it, tot: state.totals.map(q), w: q(tune.net_between - NET.wait), ack: NET.acks, ev: NET.tagLog,
        v: state.vehicles.filter(v => v.active).map(v => [v.i, q(v.x), q(v.z), q(v.h), q(v.vx), q(v.vz), v.layer === 'deck' ? 1 : v.layer === 'low' ? 2 : 0, q(Math.max(0, v.stall)), q(Math.max(0, v.immune)), q(v.clean), q(v.spin), v.tags, q(v.grip)]) });
    },
  },
  get sounds() { return { ...sounds, context: audio ? audio.ac.state : 'not started' }; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
fit(); setTimeout(fit, 400);   // again once the host page has settled its bars
reset();
scene = params.get('scene') || 'title';
if (params.get('room') && typeof WebSocket !== 'undefined') netJoin(params.get('room'));   // an invite link: straight into that room
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
