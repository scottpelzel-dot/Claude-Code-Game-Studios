'use strict';
// ---- Built to be checked ----------------------------------------------------------------

const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame

let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;

// ---- Screen: a WebGL canvas for the town, a 2D canvas over it for the HUD -----------------

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------

const touch = { on: false, coarse: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches), steerId: null, x0: 0, y0: 0, x: 0, y: 0, held: new Map() };
const PAD = { x: 170, y: H - 150 };   // where the pad rests; it moves under the thumb when touched
const BTN = {
  drift: { x: W - 130, y: H - 140, r: 76, label: 'DRIFT' },
  pause: { x: W - 150, y: 232, r: 34, label: 'PAUSE' }, reset: { x: W - 66, y: 232, r: 34, label: 'RESET' },

const touchHeld = k => { for (const v of touch.held.values()) if (v === k) return true; return false; };

  if (audio && !snd) initSound();
  if (!snd || snd.dead) return;
  try {
    const t = audio.ac.currentTime, playing = scene === 'play' && state.phase === 'run';
    const p = state.vehicles[ME], sp = Math.hypot(p.vx, p.vz);

    snd.ef.frequency.setTargetAtTime(380 + sp * 40, t, 0.05);
    snd.eg.gain.setTargetAtTime(playing ? 0.07 + 0.06 * Math.abs(p.inp.throttle) : 0, t, 0.08);
    const it = state.vehicles[state.it];

// =========================================================================================
// THE TOWN: one district of an arcade Houston (not the real map). A grid of streets with open
// grass lots, then a bayou along the north side, and downtown's skyline on the far bank.
// North is +z. Two ways over the bayou: the paved bridge at x = 0, and a dirt ramp down the
// bank to a low-water crossing at x = 60. Trails run along both banks and under the bridge.
// =========================================================================================
const ROAD = 16, PITCH = 60, BLOCK = PITCH - ROAD;        // metres
const NODES = [-120, -60, 0, 60, 120];                    // street centre lines, west to east
const NODES_Z = [-120, -60, 0, 60, 120, 180];             // south to north; the last is downtown's street
const BCEN = [-90, -30, 30, 90];                          // block centres
const EDGE = 131, NORTH = 192;                            // the sea wall, and the foot of the skyline
const CH = { z0: 130, z1: 170, slope: 9, depth: 4.5, w0: 146, w1: 154, fordX: 60, fordW: 10, bridgeW: 8 }; // the bayou's channel
const walls = [];                                         // {x0,x1,z0,z1}: what vehicles bounce off
const posts = [];                                         // {x,z,r}: round things to bounce off
const deckWalls = [], lowWalls = [];                      // the bridge rails (on the bridge) and its abutments (down on the bank)
const PLAZA = { x: 30, z: 30 }, GRASS = 0x19c98c, POND = 0x00d2ff, DIRT = 0xc98b4a, GRAVEL = 0xe0cfa0, WATER = 0x1fa8e8, CONCRETE = 0x8a7fb0;
const PAL = {
  sky: [[0, '#1a1a6e'], [0.35, '#7a2bbf'], [0.6, '#ff3d8b'], [0.8, '#ff9a3d'], [1, '#ffe66b']],
  fog: 0xff7a6b, ground: 0x12b89a, road: 0x3a3158, line: 0xffe14a, kerbA: 0xff2e63, kerbB: 0xffffff, walk: 0xe9b872,
  bld: [0xff5e3a, 0x00d2ff, 0xffd400, 0xff2e93, 0x7dff5a, 0xf2f2ff, 0xff9a3d], roof: [0x24204a, 0x3a1f5c],
  win: 0x1b2a6b, neon: [0xff2e93, 0x00f0ff, 0xffe14a], it: '#ffe14a', ink: '#1a1a6e',
};
function bankY(z) { // how far the ground drops into the bayou at this z
  if (z <= CH.z0 || z >= CH.z1) return 0;
  if (z < CH.z0 + CH.slope) return -(z - CH.z0) / CH.slope * CH.depth;
  if (z > CH.z1 - CH.slope) return -(CH.z1 - z) / CH.slope * CH.depth;
  return -CH.depth;
}
function surfaceAt(v) { // 'road', 'dirt' (grass lots and the banks) or 'water'
  const x = v.x, z = v.z;
  if (z > CH.z0 && z < CH.z1) {
    if (v.layer === 'deck') return 'road';
    return z > CH.w0 && z < CH.w1 && Math.abs(x - CH.fordX) > CH.fordW ? 'water' : 'dirt';
  }
  if (z >= CH.z1) return 'road';
  for (const n of NODES) if (Math.abs(x - n) <= ROAD / 2 || Math.abs(z - n) <= ROAD / 2) return 'road';
  if (Math.abs(x - PLAZA.x) < BLOCK / 2 && Math.abs(z - PLAZA.z) < BLOCK / 2) return 'road';

const scene3 = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(58, W / H, 0.3, 2400);
{ // the sunset sky
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512); PAL.sky.forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene3.background = t;
}
scene3.fog = new THREE.Fog(PAL.fog, 170, 680);
scene3.add(new THREE.HemisphereLight(0xb9a0ff, 0xff7a9a, 2.3));
const SUN_DIR = new THREE.Vector3(-0.42, 0.36, 0.83).normalize();   // low in the north-west, behind downtown: long shadows
const sun = new THREE.DirectionalLight(0xffb36b, 3.0); sun.castShadow = !CHEAP;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
{ const sc = sun.shadow.camera; sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 10; sc.far = 420; }
scene3.add(sun, sun.target);

let vseed = 20261122; const vr = () => (vseed = (vseed * 16807) % 2147483647, (vseed & 0xffff) / 0xffff); // looks only, never gameplay
const lit = [], glow = [];                                 // boxes to draw: lit by the sun, or glowing
const box = (w, h, d, c, x, y, z) => lit.push([w, h, d, c, x, y, z]);
const neon = (w, h, d, c, x, y, z) => glow.push([w, h, d, c, x, y, z]);
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const lam = (c, o) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
function flush(list, mat, shadows) {
  const m = new THREE.InstancedMesh(unitBox, mat, list.length), o = new THREE.Object3D(), col = new THREE.Color();
  list.forEach((b, i) => { o.position.set(b[4], b[5], b[6]); o.scale.set(b[0], b[1], b[2]); o.updateMatrix(); m.setMatrixAt(i, o.matrix); m.setColorAt(i, col.set(b[3])); });
  m.castShadow = m.receiveShadow = shadows; m.frustumCulled = false; scene3.add(m); return m;
}
function slab(x0, x1, zA, yA, zB, yB, color, o) { // a flat or sloping sheet of ground between two z lines
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([x0, yA, zA, x1, yA, zA, x1, yB, zB, x0, yA, zA, x1, yB, zB, x0, yB, zB], 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide, ...o })); m.receiveShadow = true; scene3.add(m); return m;
}
function building(x, z, w, d) {
  const h = 10 + vr() * 18, c = PAL.bld[Math.floor(vr() * PAL.bld.length)];
  box(w, h, d, c, x, h / 2, z); walls.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });   // only the building itself is solid
  for (let y = 4; y < h - 1.5; y += 3.3) { box(w + 0.24, 1.5, d * 0.84, PAL.win, x, y, z); box(w * 0.84, 1.5, d + 0.24, PAL.win, x, y, z); } // glass bands, all four faces
  box(w * 0.6, 2.4, d * 0.6, PAL.roof[Math.floor(vr() * 2)], x, h + 1.2, z);
  const n = PAL.neon[Math.floor(vr() * 3)], side = Math.floor(vr() * 4);                                                                 // one neon sign strip
  if (side < 2) neon(0.4, 1.5, d * 0.55, n, x + (side ? 1 : -1) * (w / 2 + 0.25), 6.6, z); else neon(w * 0.55, 1.5, 0.4, n, x, 6.6, z + (side === 2 ? 1 : -1) * (d / 2 + 0.25));
}
const palms = [];
function kerbs(x0, x1, z0, z1) { // red and white stripes round a block, low enough to drive over

// Every block is open ground: grass you can drive across, with buildings standing on it as

for (const bx of BCEN) for (const bz of BCEN) {

    box(BLOCK, 0.06, BLOCK, PAL.walk, bx, 0.03, bz);
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) if ((i + j) % 2 === 0) box(7.6, 0.04, 7.6, 0xff8fc7, bx + i * 7.6, 0.08, bz + j * 7.6);
    box(9, 0.9, 9, 0x00d2ff, bx, 0.6, bz); box(7.4, 0.5, 7.4, 0x7df0ff, bx, 1.05, bz); box(1.6, 4.2, 1.6, 0xf2f2ff, bx, 2.4, bz); neon(2.6, 0.5, 2.6, 0xffe14a, bx, 4.7, bz);

  else if (kind === 3) for (const sx of [-1, 1]) for (const sz of [-1, 1]) building(bx + sx * 11.5, bz + sz * 11.5, 11, 11);   // four, with a cross of grass
  else { box(15, 0.04, 10, POND, bx + 3, 0.08, bz - 2); for (let i = 0; i < 4; i++) spots.push([(vr() - 0.5) * 26, (vr() - 0.5) * 26]); }   // a park: palms and a pond to splash through

  }
}
// lane dashes down every street, clear of the junctions
for (const n of NODES) for (let t = -124; t < 124; t += 7) {

for (let t = -124; t < 124; t += 7) if (!NODES.some(m => Math.abs(t + 1.5 - m) < 11)) box(3, 0.04, 0.45, PAL.line, t + 1.5, 0.03, 180);   // downtown's street
for (let z = CH.z0 - 1; z < CH.z1; z += 7) box(0.45, 0.04, 3, PAL.line, 0, 0.03, z + 1.5);                                             // over the bridge

// ---- The bayou: banks sloping down to dirt trails and shallow water, 4.5 m below the streets
{
  const X0 = -EDGE, X1 = EDGE, bot = -CH.depth, sA = CH.z0 + CH.slope, sB = CH.z1 - CH.slope;

  slab(X0 - 600, X1 + 600, CH.w0, bot + 0.2, CH.w1, bot + 0.2, WATER, { transparent: true, opacity: 0.82 });   // the water, running on out of town
  const f0 = CH.fordX - CH.fordW, f1 = CH.fordX + CH.fordW;

  const sub = youIt ? 'Mr. Crouch: ' + LINES.gripes[state.gripe] : me.immune > 0 ? `You are safe: no tag-backs for ${me.immune.toFixed(1)} s` : '';

  } else {
    panel(W / 2 - 86, 14, 172, 62, urgent ? 'rgba(160,20,60,0.9)' : undefined);
    text(clockText, W / 2, 40, 38, '#fff'); text(`ROUND ${state.round} OF ${tune.rounds}`, W / 2, 66, 14, '#ffe14a');
    panel(16, 14, 300, 38 + R.length * 28); text('SECONDS CLEAN', 30, 31, 15, '#ffe14a', 'left');
    R.forEach((v, n) => {
      const y = 58 + n * 28, isIt = v.i === state.it;
      icon(v.kind, 40, y, 8, isIt); text(who(v.i), 60, y, 17, isIt ? PAL.it : '#fff', 'left');
      if (v.immune > 0) text('SAFE ' + v.immune.toFixed(1), 232, y, 14, '#7dff5a', 'right');

    });
    minimap(W - 148, 16, 172);
    if (state.phase === 'run') {
      panel(W / 2 - 300, H - 118, 600, 50, youIt ? 'rgba(255,225,74,0.95)' : undefined); text(status, W / 2, H - 92, youIt ? 30 : 24, youIt ? PAL.ink : dIt < 40 ? '#ff6a8a' : '#fff');
      if (sub) text(sub, W / 2, H - 46, 20, youIt ? '#fff' : '#7dff5a');
    }
    if (state.msgT > 0) { ctx.globalAlpha = Math.min(1, state.msgT * 2); panel(W / 2 - 400, 92, 800, 40); text(state.msg, W / 2, 112, 20, '#fff'); ctx.globalAlpha = 1; }
    const kmh = Math.round(Math.hypot(me.vx, me.vz) * 3.6), off = me.surf !== 'road';
    panel(16, H - 62, off ? 250 : 150, 46); text(kmh + ' km/h', 91, H - 39, 24, '#fff'); if (off) text(me.surf.toUpperCase(), 206, H - 39, 18, me.surf === 'water' ? '#7fd8ff' : '#e0b070');
  }
  // an arrow at the edge of the screen: to IT, or to your nearest target
  let target = it;
  if (youIt) { target = null; let bd = 1e9; for (const o of R) { if (o === me) continue; const d = Math.hypot(o.x - me.x, o.z - me.z) + (o.immune > 0 ? 500 : 0); if (d < bd) { bd = d; target = o; } } }
  const s = toScreen(target.x, target.y + 3, target.z), top = PH ? 230 : 160;
  if (s.behind || s.x < 40 || s.x > W - 40 || s.y < 40 || s.y > H - 40) {
    let dx = s.x - W / 2, dy = s.y - H / 2; if (s.behind) { dx = -dx; dy = Math.abs(dy) + 200; }
    const a = Math.atan2(dy, dx), ex = clamp(W / 2 + Math.cos(a) * 900, PH ? 270 : 70, W - (PH ? 250 : 70)), ey = clamp(H / 2 + Math.sin(a) * 900, top, H - 150), big = PH ? 1.5 : 1;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.scale(big, big); ctx.fillStyle = youIt ? '#fff' : PAL.it; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(-16, -22); ctx.lineTo(-6, 0); ctx.lineTo(-16, 22); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
    icon(target.kind, ex - Math.cos(a) * 40 * big, ey - Math.sin(a) * 40 * big, 9 * big, target === it);
  }
  if (touch.on) touchHud();
  if (state.phase === 'countdown') { const n = Math.ceil(state.count * 3 / Math.max(tune.countdown, 0.01)); panel(W / 2 - 90, H / 2 - 110, 180, 120); text(String(clamp(n, 1, 3)), W / 2, H / 2 - 50, 96, PAL.it); }
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,225,74,${state.flash * 1.2})`; ctx.fillRect(0, 0, W, H); }
}
function touchHud() { // the thumb controls, drawn: a round directional pad on the left, buttons on the right
  const ring = (x, y, r, fill, line) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = line; ctx.stroke(); };
  for (const k in BTN) { const b = BTN[k], on = touchHeld(k); ring(b.x, b.y, b.r, on ? 'rgba(255,225,74,0.9)' : 'rgba(20,12,48,0.6)', on ? PAL.ink : '#fff'); text(b.label, b.x, b.y, b.r > 40 ? 26 : 16, on ? PAL.ink : '#fff'); }

  let kx = held ? touch.x - touch.x0 : 0, ky = held ? touch.y - touch.y0 : 0; const kd = Math.hypot(kx, ky); if (kd > R) { kx *= R / kd; ky *= R / kd; }
  ring(bx, by, R + 30, 'rgba(20,12,48,0.55)', '#fff');
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2, c = Math.cos(a), n = Math.sin(a), t = R + 18, u = R + 2; ctx.beginPath(); ctx.moveTo(bx + c * t, by + n * t); ctx.lineTo(bx + c * u - n * 11, by + n * u + c * 11); ctx.lineTo(bx + c * u + n * 11, by + n * u - c * 11); ctx.closePath(); ctx.fill(); }
  ring(bx + kx, by + ky, 36, held ? PAL.it : 'rgba(255,255,255,0.85)', PAL.ink);
  if (!held) text('PUSH TO DRIVE', bx, by - R - 52, 18, '#fff');
  if (innerHeight > innerWidth) { panel(W / 2 - 330, H / 2 - 40, 660, 80, 'rgba(255,225,74,0.95)'); text('Turn your phone sideways', W / 2, H / 2, 40, PAL.ink); }
}
function drawPlay() { ctx.clearRect(0, 0, W, H); place(ALPHA); chaseCam(ALPHA); render(); hud(); }

function boardLines(y) { // the scoreboard on the between-round and results screens: two columns for a big field
  const R = rigs(), two = R.length > 4, per = two ? Math.ceil(R.length / 2) : R.length;
  R.forEach((v, n) => { const cx = two ? W / 2 + (n < per ? -250 : 250) : W / 2, yy = y + (n % per) * 34, fs = two ? 19 : 22;
    icon(v.kind, cx - 200, yy, 9, false); text(who(v.i), cx - 176, yy, fs, v.i === ME ? PAL.it : '#fff', 'left'); text(fmt(state.totals[v.i]) + ' s', cx + 200, yy, fs, '#fff', 'right'); });
}
function star(x, y, r, on) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fillStyle = on ? PAL.it : 'rgba(255,255,255,0.18)'; ctx.fill(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke(); }
const go = () => touch.on || touch.coarse ? 'Tap' : 'Press Enter';

let titleT = 0;
const CARDS = [W / 2 - 318, W / 2 - 106, W / 2 + 106, W / 2 + 318], CARD_W = 200, CARD_Y = 252, CARD_H = 172, BOTS_Y = 452;
const moreBots = () => { CONFIG.bots.value = tune.bots >= CONFIG.bots.max ? CONFIG.bots.min : tune.bots + 1; };
function titleTap(x, y) { // pick a rig, or change how many bots; anything else starts the shift
  for (let i = 0; i < 4; i++) if (Math.abs(x - CARDS[i]) < CARD_W / 2 && y > CARD_Y && y < CARD_Y + CARD_H) { ME = i; tone(660, 0.08, 'square', 0.15); return true; }
  if (Math.abs(x - W / 2) < 230 && Math.abs(y - BOTS_Y) < 22) { moreBots(); tone(520, 0.08, 'square', 0.15); return true; }
  return false;
}
const scenes = {
  figures: { // every vehicle side by side, its name under it
    update(dt) { state.t += dt; },
    draw() {
      ctx.clearRect(0, 0, W, H);
      const vs = state.vehicles, spots = [[46, 18], [38.5, 18], [30, 18], [22.5, 18], [15.5, 18]];
      const shown = [0, 1, 2, 3, NR];
      vs.forEach((v, i) => { const n = shown.indexOf(i); v.active = n >= 0; if (n >= 0) { v.x = v.px = spots[n][0]; v.z = v.pz = spots[n][1]; v.h = v.ph = 2.45; v.vx = v.vz = 0; v.y = 0; v.pitch = 0; v.immune = 0; } });

      cam.fov = 64; cam.updateProjectionMatrix(); cam.position.set(30, 7, -8); cam.lookAt(30, 1.5, 16); render();
      panel(0, H - 150, W, 150);
      ['amb', 'fire', 'cop', 'hum', 'civ'].forEach((k, i) => { const s = toScreen(spots[i][0], 0, spots[i][1]); text(KINDS[k].label + (i >= 4 ? '' : i === ME ? ' (you)' : ' (bot)'), s.x, H - 110, 20, '#fff'); });

  title: { // the rules, the rig to drive, how many bots, the controls

      for (let i = 0; i < 4; i++) if (pressed('Digit' + (i + 1))) ME = i;
      if (pressed('KeyB')) moreBots();

    draw() {
      ctx.clearRect(0, 0, W, H); place(1);

      cam.fov = 58; cam.updateProjectionMatrix(); cam.position.set(Math.sin(a) * 5, 9 + Math.sin(a * 0.7), 84 + Math.sin(a * 0.5) * 10); cam.lookAt(0, 30, 205); render();

      RIGS.forEach((k, i) => {
        const x = CARDS[i], on = i === ME, K = KINDS[k], nb = botSeats().filter(j => j % 4 === i).length;
        panel(x - CARD_W / 2, CARD_Y, CARD_W, CARD_H, on ? 'rgba(255,225,74,0.96)' : undefined);
        icon(k, x, CARD_Y + 34, 15, false); text(K.label, x, CARD_Y + 76, 23, on ? PAL.ink : '#fff');
        text(K.good, x, CARD_Y + 104, 15, on ? PAL.ink : '#7dff5a'); text(K.bad, x, CARD_Y + 126, 15, on ? PAL.ink : '#ff9ab0');
        text(on ? (nb ? `YOU + ${nb} BOT` : 'YOU') : nb ? `${nb} BOT${nb > 1 ? 'S' : ''}` : 'SITS OUT', x, CARD_Y + 153, 16, on ? PAL.ink : '#d8ccff');
      });
      panel(W / 2 - 230, BOTS_Y - 20, 460, 40); text(`RIVAL BOTS: ${tune.bots}   (${touchy ? 'tap' : 'B'} to change)`, W / 2, BOTS_Y, 19, '#ffe14a');
      panel(W / 2 - 430, 486, 860, 70); (touchy ? TOUCH_CONTROLS : CONTROLS).forEach((c, i) => text(c, W / 2, 507 + i * 28, 17, '#fff'));

  },
  play: {
    update(dt) { if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; } playStep(dt); },
    draw: drawPlay,
  },
  pause: {

  },
  between: { // a round won: on to the next

      text(`${SEAT_NAMES[state.it]} was left holding Mr. Crouch`, W / 2, 230, 26, '#fff'); boardLines(300);
      text(state.round + 1 >= tune.rounds ? 'Last round: the bots stop being polite' : 'Next round: the bots wake up', W / 2, 470, 24, '#d8ccff');

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); soundStep();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get me() { return ME; }, set me(i) { ME = i; },
  get sounds() { return { ...sounds, context: audio ? audio.ac.state : 'not started' }; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },

addEventListener('resize', fit); fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
