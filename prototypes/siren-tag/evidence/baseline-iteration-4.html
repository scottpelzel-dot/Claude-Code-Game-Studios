<html lang="en">

<style>

<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script>
'use strict';
// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD
const FONT = '"Arial Black", "Arial Bold", Impact, sans-serif';
const TITLE = 'Crash Out', EDITION = 'Houston Edition';
const CONTROLS = ['W / Up: accelerate    S / Down: brake, reverse', 'A D / Left Right: steer    Space: handbrake drift',
  'R: back on the road    P: pause    M: mute'];
const TOUCH_CONTROLS = ['On a phone: hold it sideways', 'Left thumb pad: push forward to go, back to brake and reverse, sideways to steer', 'Right thumb: DRIFT button'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: a WebGL canvas for the town, a 2D canvas over it for the HUD -----------------
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !CHEAP });
renderer.shadowMap.enabled = !CHEAP; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
function fit() { // fills the window at any size and pixel ratio
  const s = Math.min(innerWidth / W, innerHeight / H);
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.style.marginTop = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  renderer.setPixelRatio(CHEAP ? 0.5 : Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(cw, ch, true);
}
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function panel(x, y, w, h, c = 'rgba(20,12,48,0.82)') { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio(); touch.on = false;
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', e => { startAudio(); if (scene === 'title' && pickCard(...toLogical(e))) return; if (scene === 'title' || scene === 'between' || scene === 'over' || scene === 'results' || scene === 'pause') hit.add('Enter'); }); // a click works wherever Enter does
addEventListener('blur', () => down.clear());

// ---- Touch: on a phone, the left thumb works a full directional pad (forward to go, back to
// brake and reverse, sideways to steer), with buttons to drift, reset and pause. Turned on by the first touch.
const touch = { on: false, coarse: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches), steerId: null, x0: 0, y0: 0, x: 0, y: 0, held: new Map() };
const PAD = { x: 170, y: H - 150 };   // where the pad rests; it moves under the thumb when touched
const BTN = {
  drift: { x: W - 130, y: H - 140, r: 76, label: 'DRIFT' },
  pause: { x: W - 138, y: 226, r: 30, label: 'PAUSE' }, reset: { x: W - 62, y: 226, r: 30, label: 'RESET' },
};
const touchHeld = k => { for (const v of touch.held.values()) if (v === k) return true; return false; };
function toLogical(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  touch.on = true; if (scene !== 'play') return;
  const [x, y] = toLogical(e);
  for (const k in BTN) { const b = BTN[k]; if (Math.hypot(x - b.x, y - b.y) < b.r * 1.25) { touch.held.set(e.pointerId, k); if (k === 'reset') hit.add('KeyR'); if (k === 'pause') hit.add('KeyP'); return; } }
  if (x < W * 0.5 && touch.steerId === null) { touch.steerId = e.pointerId; touch.x0 = touch.x = x; touch.y0 = touch.y = clamp(y, 150, H - 110); }
});
addEventListener('pointermove', e => { if (e.pointerId === touch.steerId) [touch.x, touch.y] = toLogical(e); });
for (const type of ['pointerup', 'pointercancel']) addEventListener(type, e => { if (e.pointerId === touch.steerId) touch.steerId = null; touch.held.delete(e.pointerId); });
addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // no scrolling or pull-to-refresh under the thumbs

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false, snd = null;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0) {
  if (!audio || muted) return;
  try {
    const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
  } catch (e) { /* a stand-in audio context in a check */ }
}
function initSound() { // the engine drone, the siren and a noise buffer for crunches
  snd = { dead: true };
  try {
    const ac = audio.ac;
    const eng = ac.createOscillator(), ef = ac.createBiquadFilter(), eg = ac.createGain();
    eng.type = 'sawtooth'; ef.type = 'lowpass'; ef.frequency.value = 420; eg.gain.value = 0;
    eng.connect(ef).connect(eg).connect(audio.out); eng.start();
    const sir = ac.createOscillator(), sg = ac.createGain();
    sir.type = 'triangle'; sg.gain.value = 0; sir.connect(sg).connect(audio.out); sir.start();
    const buf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate), d = buf.getChannelData(0);
    let s = 1234567; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 1073741824 - 1) * (1 - i / d.length); }
    snd = { eng, ef, eg, sir, sg, buf };
  } catch (e) { /* no sound: the game still plays */ }
}
function crunch(power) { // power 0..1
  if (!snd || snd.dead || muted) return;
  try {
    const ac = audio.ac, t = ac.currentTime, n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = snd.buf; f.type = 'lowpass'; f.frequency.value = 500 + power * 2600;
    g.gain.setValueAtTime(0.25 + power * 0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18 + power * 0.25);
    n.connect(f).connect(g).connect(audio.out); n.start(t);
    tone(90 - power * 30, 0.2 + power * 0.15, 'sine', 0.3 + power * 0.4, 40);
  } catch (e) { /* ignore */ }
}
function soundStep() {
  if (audio && !snd) initSound();
  if (!snd || snd.dead) return;
  try {
    const t = audio.ac.currentTime, playing = scene === 'play' && state.phase === 'run';
    const p = state.vehicles[ME], sp = Math.hypot(p.vx, p.vz);
    snd.eng.frequency.setTargetAtTime(48 + sp * 4.6 + (p.drift ? -14 : 0), t, 0.05);   // climbs with speed, drops in a slide
    snd.ef.frequency.setTargetAtTime(380 + sp * 40, t, 0.05);
    snd.eg.gain.setTargetAtTime(playing ? 0.07 + 0.06 * Math.abs(p.inp.throttle) : 0, t, 0.08);
    const it = state.vehicles[state.it];
    let vol = 0, f = 700;
    if (playing) {
      if (state.it === ME) { f = (state.t * 2.2) % 1 < 0.5 ? 660 : 880; vol = 0.035; }       // your own two-tone
      else { f = 760 + 260 * Math.sin(state.t * 5.2); vol = 0.16 * Math.max(0, 1 - Math.hypot(it.x - p.x, it.z - p.z) / 130); } // IT's wail gets louder as it closes
    }
    snd.sir.frequency.setTargetAtTime(f, t, 0.03); snd.sg.gain.setTargetAtTime(vol, t, 0.1);
  } catch (e) { /* ignore */ }
}

// =========================================================================================
// THE TOWN: one district of an arcade Houston (not the real map). A 5 by 5 grid of streets around 16 blocks.
// =========================================================================================
const ROAD = 16, PITCH = 60, BLOCK = PITCH - ROAD;        // metres
const NODES = [-120, -60, 0, 60, 120];                    // street centre lines, both ways
const BCEN = [-90, -30, 30, 90];                          // block centres
const EDGE = 131;                                         // the sea wall
const walls = [];                                         // {x0,x1,z0,z1}: what vehicles bounce off
const posts = [];                                         // {x,z,r}: round things to bounce off
const PLAZA = { x: 30, z: 30 }, GRASS = 0x19c98c, POND = 0x00d2ff;
const PAL = {
  sky: [[0, '#1a1a6e'], [0.35, '#7a2bbf'], [0.6, '#ff3d8b'], [0.8, '#ff9a3d'], [1, '#ffe66b']],
  fog: 0xff7a6b, ground: 0x12b89a, road: 0x3a3158, line: 0xffe14a, kerbA: 0xff2e63, kerbB: 0xffffff, walk: 0xe9b872,
  bld: [0xff5e3a, 0x00d2ff, 0xffd400, 0xff2e93, 0x7dff5a, 0xf2f2ff, 0xff9a3d], roof: [0x24204a, 0x3a1f5c],
  win: 0x1b2a6b, neon: [0xff2e93, 0x00f0ff, 0xffe14a], it: '#ffe14a', ink: '#1a1a6e',
};
const scene3 = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(58, W / H, 0.3, 2400);
{ // the sunset sky
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512); PAL.sky.forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene3.background = t;
}
scene3.fog = new THREE.Fog(PAL.fog, 150, 620);
scene3.add(new THREE.HemisphereLight(0xb9a0ff, 0xff7a9a, 2.3));
const SUN_DIR = new THREE.Vector3(-0.42, 0.36, 0.83).normalize();   // low, down the long streets: long shadows
const sun = new THREE.DirectionalLight(0xffb36b, 3.0); sun.castShadow = !CHEAP;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
{ const sc = sun.shadow.camera; sc.left = -95; sc.right = 95; sc.top = 95; sc.bottom = -95; sc.near = 10; sc.far = 420; }
scene3.add(sun, sun.target);

let vseed = 20261122; const vr = () => (vseed = (vseed * 16807) % 2147483647, (vseed & 0xffff) / 0xffff); // looks only, never gameplay
const lit = [], glow = [];                                 // boxes to draw: lit by the sun, or glowing
const box = (w, h, d, c, x, y, z) => lit.push([w, h, d, c, x, y, z]);
const neon = (w, h, d, c, x, y, z) => glow.push([w, h, d, c, x, y, z]);
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function flush(list, mat, shadows) {
  const m = new THREE.InstancedMesh(unitBox, mat, list.length), o = new THREE.Object3D(), col = new THREE.Color();
  list.forEach((b, i) => { o.position.set(b[4], b[5], b[6]); o.scale.set(b[0], b[1], b[2]); o.updateMatrix(); m.setMatrixAt(i, o.matrix); m.setColorAt(i, col.set(b[3])); });
  m.castShadow = m.receiveShadow = shadows; m.frustumCulled = false; scene3.add(m); return m;
}
function building(x, z, w, d) {
  const h = 10 + vr() * 18, c = PAL.bld[Math.floor(vr() * PAL.bld.length)];
  box(w, h, d, c, x, h / 2, z); walls.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });   // only the building itself is solid
  for (let y = 4; y < h - 1.5; y += 3.3) { box(w + 0.24, 1.5, d * 0.84, PAL.win, x, y, z); box(w * 0.84, 1.5, d + 0.24, PAL.win, x, y, z); } // glass bands, all four faces
  box(w * 0.6, 2.4, d * 0.6, PAL.roof[Math.floor(vr() * 2)], x, h + 1.2, z);
  const n = PAL.neon[Math.floor(vr() * 3)], side = Math.floor(vr() * 4);                                                                 // one neon sign strip
  if (side < 2) neon(0.4, 1.5, d * 0.55, n, x + (side ? 1 : -1) * (w / 2 + 0.25), 6.6, z); else neon(w * 0.55, 1.5, 0.4, n, x, 6.6, z + (side === 2 ? 1 : -1) * (d / 2 + 0.25));
}
const palms = [];
function kerbs(x0, x1, z0, z1) { // red and white stripes round a block, low enough to drive over
  let i = 0;
  for (let x = x0; x < x1 - 0.1; x += 4, i++) { box(4, 0.16, 0.7, i % 2 ? PAL.kerbA : PAL.kerbB, x + 2, 0.08, z0); box(4, 0.16, 0.7, i % 2 ? PAL.kerbB : PAL.kerbA, x + 2, 0.08, z1); }
  for (let z = z0; z < z1 - 0.1; z += 4, i++) { box(0.7, 0.16, 4, i % 2 ? PAL.kerbA : PAL.kerbB, x0, 0.08, z + 2); box(0.7, 0.16, 4, i % 2 ? PAL.kerbB : PAL.kerbA, x1, 0.08, z + 2); }
}
// Every block is open ground: grass you can drive across, with buildings standing on it as
// separate obstacles, a few parks with nothing but palms and a pond, and the paved plaza.
for (const bx of BCEN) for (const bz of BCEN) {
  const hb = BLOCK / 2, first = walls.length;
  kerbs(bx - hb, bx + hb, bz - hb, bz + hb);
  if (bx === PLAZA.x && bz === PLAZA.z) {                   // the plaza: paving and a fountain to dodge round
    box(BLOCK, 0.06, BLOCK, PAL.walk, bx, 0.03, bz);
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) if ((i + j) % 2 === 0) box(7.6, 0.04, 7.6, 0xff8fc7, bx + i * 7.6, 0.08, bz + j * 7.6);
    box(9, 0.9, 9, 0x00d2ff, bx, 0.6, bz); box(7.4, 0.5, 7.4, 0x7df0ff, bx, 1.05, bz); box(1.6, 4.2, 1.6, 0xf2f2ff, bx, 2.4, bz); neon(2.6, 0.5, 2.6, 0xffe14a, bx, 4.7, bz);
    posts.push({ x: bx, z: bz, r: 5.6 });
    for (const [dx, dz] of [[-16, -16], [16, -16], [-16, 16], [16, 16]]) { palms.push([bx + dx, bz + dz]); posts.push({ x: bx + dx, z: bz + dz, r: 0.6 }); }
    continue;
  }
  box(BLOCK, 0.06, BLOCK, GRASS, bx, 0.03, bz);
  const kind = Math.floor(vr() * 5), spots = [[-18, -18], [18, -18], [-18, 18], [18, 18], [-18, 0], [18, 0], [0, -18], [0, 18]];
  if (kind <= 1) building(bx, bz, 19 + vr() * 6, 19 + vr() * 6);                          // one building on a wide lawn
  else if (kind === 2) { if (vr() < 0.5) for (const s of [-1, 1]) building(bx + s * 11, bz, 11, 27); else for (const s of [-1, 1]) building(bx, bz + s * 11, 27, 11); }   // two, with a lane between
  else if (kind === 3) for (const sx of [-1, 1]) for (const sz of [-1, 1]) building(bx + sx * 11.5, bz + sz * 11.5, 11, 11);   // four, with a cross of grass
  else { box(15, 0.04, 10, POND, bx + 3, 0.08, bz - 2); for (let i = 0; i < 4; i++) spots.push([(vr() - 0.5) * 26, (vr() - 0.5) * 26]); }   // a park: palms and a pond to splash through
  for (const [dx, dz] of spots) {
    const x = bx + dx, z = bz + dz;
    if (vr() > (kind === 4 ? 0.85 : 0.5) || walls.slice(first).some(w => x > w.x0 - 2.5 && x < w.x1 + 2.5 && z > w.z0 - 2.5 && z < w.z1 + 2.5)) continue;
    palms.push([x, z]); posts.push({ x, z, r: 0.5 });       // a palm trunk stops a car; everything else is open
  }
}
// lane dashes down every street, clear of the junctions
for (const n of NODES) for (let t = -124; t < 124; t += 7) {
  if (NODES.some(m => Math.abs(t + 1.5 - m) < 11)) continue;
  box(0.45, 0.04, 3, PAL.line, n, 0.03, t + 1.5); box(3, 0.04, 0.45, PAL.line, t + 1.5, 0.03, n);
}
// the sea wall round the district, striped, and the far shore
walls.push({ x0: -400, x1: 400, z0: EDGE, z1: 400 }, { x0: -400, x1: 400, z0: -400, z1: -EDGE }, { x0: EDGE, x1: 400, z0: -400, z1: 400 }, { x0: -400, x1: -EDGE, z0: -400, z1: 400 });
for (let t = -EDGE, i = 0; t < EDGE; t += 6, i++) for (const s of [-1, 1]) {
  box(6, 1.4, 1.2, i % 2 ? PAL.kerbA : PAL.kerbB, t + 3, 0.7, s * (EDGE + 0.6)); box(1.2, 1.4, 6, i % 2 ? PAL.kerbB : PAL.kerbA, s * (EDGE + 0.6), 0.7, t + 3);
}
for (let i = 0; i < 46; i++) { const a = i / 46 * Math.PI * 2, r = 215 + vr() * 110, h = 16 + vr() * 46; box(16 + vr() * 14, h, 16 + vr() * 14, PAL.bld[i % PAL.bld.length], Math.cos(a) * r, h / 2, Math.sin(a) * r); }
for (let i = 0; i < 44; i++) { const a = i / 44 * Math.PI * 2 + 0.07; palms.push([Math.cos(a) * 158, Math.sin(a) * 158]); }
const flatMat = () => new THREE.MeshLambertMaterial({ flatShading: true });
flush(lit, flatMat(), true); flush(glow, new THREE.MeshBasicMaterial(), false);
{ // road and far ground
  const road = new THREE.Mesh(new THREE.PlaneGeometry(2 * EDGE + 2, 2 * EDGE + 2), new THREE.MeshLambertMaterial({ color: PAL.road }));
  road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene3.add(road);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: PAL.ground }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = -0.2; scene3.add(sea);
}
{ // palms: leaning trunks and a fan of fronds, all instanced
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.36, 8, 6), new THREE.MeshLambertMaterial({ color: 0x6b3f2a, flatShading: true }), palms.length);
  const frond = new THREE.InstancedMesh(new THREE.ConeGeometry(0.7, 4.6, 4), new THREE.MeshLambertMaterial({ color: 0x14c46a, flatShading: true }), palms.length * 7);
  const o = new THREE.Object3D();
  palms.forEach(([x, z], i) => {
    const lean = (vr() - 0.5) * 0.24; o.position.set(x, 4.2, z); o.rotation.set(0, 0, lean); o.scale.set(1, 1, 1); o.updateMatrix(); trunk.setMatrixAt(i, o.matrix);
    for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2; o.position.set(x - lean * 4 + Math.cos(a) * 1.7, 7.9, z + Math.sin(a) * 1.7); o.rotation.set(Math.sin(a) * 1.25, 0, -Math.cos(a) * 1.25); o.updateMatrix(); frond.setMatrixAt(i * 7 + k, o.matrix); }
  });
  trunk.castShadow = frond.castShadow = true; trunk.frustumCulled = frond.frustumCulled = false; scene3.add(trunk, frond);
}
const horizon = new THREE.Group(); scene3.add(horizon);    // the huge low sun and far hills ride with the camera
{
  const far = c => new THREE.MeshBasicMaterial({ color: c, fog: false });
  const disc = new THREE.Mesh(new THREE.CircleGeometry(250, 48), far(0xfff2a0)); disc.position.set(SUN_DIR.x * 1700, 120, SUN_DIR.z * 1700); disc.lookAt(0, 120, 0); horizon.add(disc);
  for (let i = 0; i < 5; i++) { const b = new THREE.Mesh(new THREE.PlaneGeometry(640, 12 + i * 5), far(0xff5a8a)); b.position.set(SUN_DIR.x * 1690, 8 + i * 40, SUN_DIR.z * 1690); b.lookAt(0, b.position.y, 0); horizon.add(b); }
  for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2, m = new THREE.Mesh(new THREE.ConeGeometry(150 + vr() * 110, 120 + vr() * 150, 4), far(i % 2 ? 0x3a1f7a : 0x5a2a9a)); m.position.set(Math.cos(a) * 1500, 30, Math.sin(a) * 1500); m.rotation.y = vr() * 3; horizon.add(m); }
}

// =========================================================================================
// THE VEHICLES. Each kind has its own outline; each takes any driver: you, a bot, later a
// remote player. A driver is a function (vehicle) -> { throttle, steer, hand }.
// =========================================================================================
const KINDS = {

  const s = toScreen(target.x, 3, target.z);
  if (s.behind || s.x < 40 || s.x > W - 40 || s.y < 40 || s.y > H - 40) {
    let dx = s.x - W / 2, dy = s.y - H / 2; if (s.behind) { dx = -dx; dy = Math.abs(dy) + 200; }
    const a = Math.atan2(dy, dx), ex = clamp(W / 2 + Math.cos(a) * 900, 70, W - 70), ey = clamp(H / 2 + Math.sin(a) * 900, 160, H - 150);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = youIt ? '#fff' : PAL.it; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(-16, -22); ctx.lineTo(-6, 0); ctx.lineTo(-16, 22); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
    icon(target.kind, ex - Math.cos(a) * 40, ey - Math.sin(a) * 40, 9, target === it);
  }
  const kmh = Math.round(Math.hypot(me.vx, me.vz) * 3.6);
  if (touch.on) touchHud(); else { panel(16, H - 62, 150, 46); text(kmh + ' km/h', 91, H - 39, 24, '#fff'); }
  if (state.phase === 'countdown') { const n = Math.ceil(state.count * 3 / Math.max(tune.countdown, 0.01)); panel(W / 2 - 90, H / 2 - 150, 180, 120); text(String(clamp(n, 1, 3)), W / 2, H / 2 - 90, 96, PAL.it); }
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,225,74,${state.flash * 1.2})`; ctx.fillRect(0, 0, W, H); }
}
function touchHud() { // the thumb controls, drawn: a round directional pad on the left, buttons on the right
  const ring = (x, y, r, fill, line) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = line; ctx.stroke(); };
  for (const k in BTN) { const b = BTN[k], on = touchHeld(k); ring(b.x, b.y, b.r, on ? 'rgba(255,225,74,0.9)' : 'rgba(20,12,48,0.6)', on ? PAL.ink : '#fff'); text(b.label, b.x, b.y, b.r > 40 ? 24 : 14, on ? PAL.ink : '#fff'); }
  const held = touch.steerId !== null, bx = held ? touch.x0 : PAD.x, by = held ? touch.y0 : PAD.y, R = tune.touch_pad_range;
  let kx = held ? touch.x - touch.x0 : 0, ky = held ? touch.y - touch.y0 : 0; const kd = Math.hypot(kx, ky); if (kd > R) { kx *= R / kd; ky *= R / kd; }
  ring(bx, by, R + 30, 'rgba(20,12,48,0.55)', '#fff');
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2, c = Math.cos(a), n = Math.sin(a), t = R + 18, u = R + 2; ctx.beginPath(); ctx.moveTo(bx + c * t, by + n * t); ctx.lineTo(bx + c * u - n * 11, by + n * u + c * 11); ctx.lineTo(bx + c * u + n * 11, by + n * u - c * 11); ctx.closePath(); ctx.fill(); }
  ring(bx + kx, by + ky, 36, held ? PAL.it : 'rgba(255,255,255,0.85)', PAL.ink);
  if (!held) text('PUSH TO DRIVE', bx, by - R - 52, 16, '#fff');
  if (innerHeight > innerWidth) { panel(W / 2 - 330, H / 2 - 40, 660, 80, 'rgba(255,225,74,0.95)'); text('Turn your phone sideways', W / 2, H / 2, 40, PAL.ink); }
}
function drawPlay() { ctx.clearRect(0, 0, W, H); place(ALPHA); chaseCam(ALPHA); render(); hud(); }
function shade(a = 0.6) { ctx.fillStyle = `rgba(20,12,48,${a})`; ctx.fillRect(0, 0, W, H); }
function boardLines(y) {
  for (let i = 0; i < 3; i++) { const v = state.vehicles[i]; icon(v.kind, W / 2 - 190, y + i * 34, 9, false); text(KINDS[v.kind].name + (i === ME ? ' (you)' : ' (bot)'), W / 2 - 165, y + i * 34, 22, '#fff', 'left'); text(fmt(state.totals[i]) + ' s clean', W / 2 + 200, y + i * 34, 22, '#fff', 'right'); }
}
function star(x, y, r, on) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fillStyle = on ? PAL.it : 'rgba(255,255,255,0.18)'; ctx.fill(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke(); }

let titleT = 0;
const CARDS = [W / 2 - 270, W / 2, W / 2 + 270], CARD_KINDS = ['amb', 'fire', 'cop'];
const TRAITS = { amb: 'All-rounder', fire: 'Big and heavy, easy to drive', cop: 'Fast and light, gets shoved' };
function pickCard(x, y) { for (let i = 0; i < 3; i++) if (Math.abs(x - CARDS[i]) < 120 && y > 286 && y < 424) { ME = i; tone(660, 0.08, 'square', 0.15); return true; } return false; }
const scenes = {
  figures: { // every vehicle side by side, its name under it
    update(dt) { state.t += dt; },
    draw() {
      ctx.clearRect(0, 0, W, H);
      const vs = state.vehicles, spots = [[42, 18], [33.5, 18], [25, 18], [18, 18]];   // lined up on the plaza
      vs.forEach((v, i) => { v.active = i < 4; if (i < 4) { v.x = v.px = spots[i][0]; v.z = v.pz = spots[i][1]; v.h = v.ph = 2.45; v.vx = v.vz = 0; } });
      state.it = 1; state.fly = 0; place(1);
      cam.fov = 60; cam.updateProjectionMatrix(); cam.position.set(30, 7, -7); cam.lookAt(30, 1.5, 16); render();
      panel(0, H - 150, W, 150);
      ['amb', 'fire', 'cop', 'civ'].forEach((k, i) => { const s = toScreen(spots[i][0], 0, spots[i][1]); text(KINDS[k].label + (i > 2 ? '' : i === ME ? ' (you)' : ' (bot)'), s.x, H - 110, 22, '#fff'); });
      const s = toScreen(spots[1][0], 9, 0); text('Mr. Crouch, the patient: whoever carries him is IT', W / 2, H - 60, 22, PAL.it);
    },
  },
  title: { // the rules, the vehicle to drive, the controls
    update(dt) {
      titleT += dt;
      if (pressed('ArrowLeft') || pressed('KeyA')) ME = (ME + 2) % 3;
      if (pressed('ArrowRight') || pressed('KeyD')) ME = (ME + 1) % 3;
      for (let i = 0; i < 3; i++) if (pressed('Digit' + (i + 1))) ME = i;
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
    },
    draw() {
      ctx.clearRect(0, 0, W, H); place(1);
      const a = titleT * 0.12, touchy = touch.on || touch.coarse; cam.fov = 55; cam.updateProjectionMatrix(); cam.position.set(Math.sin(a) * 150, 70, Math.cos(a) * 150); cam.lookAt(0, 0, 0); render();
      shade(0.55); text(TITLE.toUpperCase(), W / 2 + 4, 94, 92, PAL.ink); text(TITLE.toUpperCase(), W / 2, 90, 92, PAL.it);
      text(EDITION.toUpperCase(), W / 2, 158, 34, '#ff6ab0');
      text('Whoever carries Mr. Crouch is IT. Ram a rival to hand him over.', W / 2, 206, 20, '#fff');
      text("Don't be IT when the clock runs out. Three rounds make a shift.", W / 2, 234, 20, '#fff');
      text(touchy ? 'TAP A VEHICLE TO DRIVE IT' : 'CHOOSE YOUR VEHICLE: LEFT / RIGHT', W / 2, 268, 16, '#ffe14a');
      CARD_KINDS.forEach((k, i) => {
        const x = CARDS[i], on = i === ME; panel(x - 120, 286, 240, 138, on ? 'rgba(255,225,74,0.95)' : undefined);
        icon(k, x, 318, 14, false); text(KINDS[k].label, x, 358, 22, on ? PAL.ink : '#fff'); text(TRAITS[k], x, 384, 15, on ? PAL.ink : '#d8ccff'); text(on ? 'YOU' : 'BOT', x, 407, 14, on ? PAL.ink : '#d8ccff');
      });
      panel(W / 2 - 430, 442, 860, 112); (touchy ? TOUCH_CONTROLS : CONTROLS).forEach((c, i) => text(c, W / 2, 466 + i * 32, 18, '#ffe14a'));
      text(touchy ? 'Tap here to start' : 'Press Enter or click here to start', W / 2, 606, 34, '#fff'); text('The other two vehicles are driven by bots', W / 2, 652, 16, '#d8ccff');
    },
  },
  play: {
    update(dt) { if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; } playStep(dt); },
    draw: drawPlay,
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) scene = 'play'; },
    draw() { drawPlay(); shade(); text('PAUSED', W / 2, H / 2 - 20, 64, '#fff'); text(touch.on ? 'Tap to carry on' : 'P to carry on', W / 2, H / 2 + 44, 24, '#ffe14a'); },
  },
  between: { // a round won: on to the next
    update() { if (pressed('Enter') || pressed('Space')) { startRound(state.round + 1); scene = 'play'; } },
    draw() {
      drawPlay(); shade(); text(`ROUND ${state.round} SURVIVED`, W / 2, 190, 60, PAL.it);
      text(`${KINDS[state.vehicles[state.it].kind].name} was left holding Mr. Crouch`, W / 2, 250, 24, '#fff'); boardLines(330);
      text(state.round + 1 >= tune.rounds ? 'Last round: the bots stop being polite' : 'Next round: the bots wake up', W / 2, 470, 22, '#d8ccff');
      text(touch.on ? 'Tap for the next round' : 'Press Enter for the next round', W / 2, 540, 30, '#fff');
    },
  },
  over: { // IT at the buzzer: the round again, never the whole shift
    update() { if (pressed('KeyR') || pressed('Enter')) { startRound(state.round); scene = 'play'; } },
    draw() {
      drawPlay(); shade(0.7); text('ROUND LOST', W / 2, 220, 72, '#ff6a8a'); text(state.gained, W / 2, 300, 24, '#fff');
      text('"I shall be writing a letter." - Mr. Crouch', W / 2, 350, 22, '#ffe14a'); text(touch.on ? 'Tap to try this round again' : 'Press Enter to try this round again', W / 2, 460, 30, '#fff');
    },
  },
  results: {
    update() { if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      drawPlay(); shade(0.7); text('SHIFT OVER', W / 2, 130, 64, PAL.it); text('PUBLIC TRUST', W / 2, 200, 22, '#fff');
      for (let i = 0; i < 5; i++) star(W / 2 - 160 + i * 80, 262, 34, i < state.stars);
      boardLines(350); text(`You handed Mr. Crouch over ${state.vehicles[ME].tags} time${state.vehicles[ME].tags === 1 ? '' : 's'}`, W / 2, 470, 22, '#d8ccff');
      text(`${state.score} seconds clean: ${touch.on ? 'tap' : 'press Enter'} for another shift`, W / 2, 550, 26, '#fff');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); soundStep();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

addEventListener('resize', fit); fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
